name: Release

# Pushing a tag like v0.2.0 builds the Windows and Linux downloads (archives, the Windows
# installer and the Linux install.sh), a multi-arch Docker image, checksums and an SBOM, and publishes a GitHub release with the CHANGELOG.md section as notes.
# Running it manually does a dry run: everything is built and uploaded as workflow artifacts,
# but nothing is published.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  ZIG_VERSION: 0.14.1
  # build-push-action uploads a .dockerbuild record per build; download-artifact can't extract those.
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable: ${{ steps.version.outputs.stable }}
      publish: ${{ steps.version.outputs.publish }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: check version
        run: |
          crate=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
            if [ "$version" != "$crate" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the workspace version $crate in Cargo.toml"
              exit 1
            fi
            publish=true
          else
            version=$crate
            publish=false
          fi
          # Versions with a suffix (0.2.0-rc.1) are pre-releases everywhere. 0.x versions are
          # marked as pre-releases on GitHub but still get the Docker `latest` tag.
          case "$version" in *-*) stable=false ;; *) stable=true ;; esac
          case "$version" in *-* | 0.*) prerelease=true ;; *) prerelease=false ;; esac
          owner=${GITHUB_REPOSITORY_OWNER,,}
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "stable=$stable"
            echo "publish=$publish"
            echo "image=ghcr.io/$owner/reelix"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (prerelease: $prerelease, stable: $stable, publish: $publish)"
      - name: release notes
        run: |
          scripts/release-notes.sh "${{ steps.version.outputs.version }}" > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md

  web:
    name: web UI
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: web
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: trunk
      - name: trunk build
        working-directory: crates/reelix-web
        run: trunk build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: crates/reelix-web/dist

  linux:
    name: linux ${{ matrix.arch }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker: amd64
          - arch: aarch64
            docker: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-${{ matrix.arch }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        # A stuck Zig mirror once hung this step for hours; fail fast so a re-run can retry.
        timeout-minutes: 10
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-zigbuild
      # Linking against glibc 2.17 makes the binary run on almost any non-musl distribution.
      - name: build
        run: cargo zigbuild --release --locked -p reelix-server --target ${{ matrix.arch }}-unknown-linux-gnu.2.17
      - name: check glibc requirement
        run: |
          bin=target/${{ matrix.arch }}-unknown-linux-gnu/release/reelix
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "Highest glibc symbol: $max"
          [ "$max" = GLIBC_2.17 ] || { echo "::error::Binary needs $max, expected GLIBC_2.17"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-${{ matrix.docker }}
          path: target/${{ matrix.arch }}-unknown-linux-gnu/release/reelix
          if-no-files-found: error

  windows:
    name: windows x86_64
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Link the C runtime statically so users don't need the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows
      - name: build
        run: cargo build --release --locked -p reelix-server
      - name: smoke test
        shell: bash
        run: ./target/release/reelix.exe --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-x86_64
          path: target/release/reelix.exe
          if-no-files-found: error

  archives:
    name: archives
    needs: [prepare, web, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dl1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: web
          path: artifacts/web
      - name: retry download (web)
        if: steps.dl1.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: artifacts/web
      - id: dl2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: bin-*
          path: artifacts
      - name: retry download (bin-*)
        if: steps.dl2.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: artifacts
      - name: package archives
        run: |
          chmod +x artifacts/bin-linux-*/reelix
          scripts/package.sh linux x86_64 "$VERSION" artifacts/bin-linux-amd64/reelix artifacts/web dist
          scripts/package.sh linux aarch64 "$VERSION" artifacts/bin-linux-arm64/reelix artifacts/web dist
          scripts/package.sh windows x86_64 "$VERSION" artifacts/bin-windows-x86_64/reelix.exe artifacts/web dist
      - name: smoke test linux archive
        run: |
          mkdir smoke && tar -C smoke -xzf "dist/reelix-$VERSION-linux-x86_64.tar.gz"
          cd "smoke/reelix-$VERSION-linux-x86_64"
          grep -qx '{"kind": "portable"}' install.json
          ./reelix --port 7799 --data-dir "$RUNNER_TEMP/data" &
          pid=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:7799/api/v1/setup && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7799/api/v1/setup
          curl -fsS -o /dev/null http://127.0.0.1:7799/
          kill "$pid"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist
          if-no-files-found: error

  windows-installer:
    name: windows installer
    needs: [prepare, archives]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dl7
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: archives
          path: archives
      - name: retry download (archives)
        if: steps.dl7.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: archives
      # The installer is built from the released zip, so both ship byte-identical files.
      - name: build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          $name = "reelix-$env:VERSION-windows-x86_64"
          Expand-Archive "archives\$name.zip" -DestinationPath "$env:RUNNER_TEMP\win"
          & $iscc /Qp "/DAppVersion=$env:VERSION" "/DSourceDir=$env:RUNNER_TEMP\win\$name" "/O$env:GITHUB_WORKSPACE\installer" packaging\windows\reelix.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem installer
      - name: smoke test (install for me only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "installer\reelix-$env:VERSION-windows-x86_64-setup.exe"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-user.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-user.log"; throw "setup exited $($p.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\Reelix"
          foreach ($f in 'reelix.exe', 'install.json', 'web\index.html', 'unins000.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$dir\$f missing" }
          }
          $kind = (Get-Content "$dir\install.json" -Raw | ConvertFrom-Json).kind
          if ($kind -ne 'windows-user') { throw "install.json kind is '$kind'" }
          & "$dir\reelix.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "reelix --version exited $LASTEXITCODE" }
          # Leave it running: the uninstaller has to stop it.
          $rx = Start-Process "$dir\reelix.exe" -WorkingDirectory $dir -PassThru -ArgumentList '--port', '7799', '--data-dir', "$env:RUNNER_TEMP\rx-data"
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7799/api/v1/system/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw 'installed reelix.exe did not become healthy' }
          $p = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\uninstall-user.log"
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
          # The uninstaller re-launches itself from %TEMP%; wait for it to finish.
          foreach ($i in 1..60) { if (-not (Test-Path "$dir\reelix.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$dir\reelix.exe") { Get-Content "$env:RUNNER_TEMP\uninstall-user.log" -ErrorAction SilentlyContinue; throw 'reelix.exe still installed' }
          if (-not $rx.HasExited) { throw 'uninstall did not stop the running reelix.exe' }
      - name: smoke test (install for all users, Windows service)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "installer\reelix-$env:VERSION-windows-x86_64-setup.exe"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/ALLUSERS', '/NORESTART', "/LOG=$env:RUNNER_TEMP\setup-service.log"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup-service.log"; throw "setup exited $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\Reelix"
          $kind = (Get-Content "$dir\install.json" -Raw | ConvertFrom-Json).kind
          if ($kind -ne 'windows-service') { throw "install.json kind is '$kind'" }
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:7700/api/v1/system/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Get-Service Reelix | Format-List Name, Status, StartType
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\setup-service.log"; throw 'service did not become healthy' }
          $p = Start-Process "$dir\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/LOG=$env:RUNNER_TEMP\uninstall-service.log"
          foreach ($i in 1..60) { if (-not (Test-Path "$dir\reelix.exe")) { break }; Start-Sleep 1 }
          if (Get-Service Reelix -ErrorAction SilentlyContinue) { throw 'service still registered after uninstall' }
          if (-not (Test-Path "$env:ProgramData\Reelix")) { throw 'uninstall deleted the data folder' }
      # Setup's "How would you like to install Reelix?" modes, driven by /MODE= etc. Each step makes
      # its own Reelix data with the portable reelix.exe from the zip, installs per-user, checks
      # the result through the API and uninstalls.
      - name: smoke test (recovery from a backup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . scripts\windows-smoke.ps1
          $src = "$env:RUNNER_TEMP\recovery-src"
          Remove-Item $ReelixData -Recurse -Force -ErrorAction SilentlyContinue
          New-ReelixData $src 'restored-admin' 7795
          $zip = (& $Portable backup create --data-dir $src | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw "reelix backup create failed: $zip" }
          # An invalid backup is refused before anything is installed.
          Set-Content "$env:RUNNER_TEMP\junk.zip" 'not a zip'
          $code = Install-Reelix 'recovery-bad' '/MODE=recovery', "/BACKUP=$env:RUNNER_TEMP\junk.zip"
          if ($code -eq 0) { throw 'setup accepted an invalid backup' }
          if (Test-Path "$InstallDir\reelix.exe") { throw 'setup installed Reelix despite the invalid backup' }
          $code = Install-Reelix 'recovery' '/MODE=recovery', "/BACKUP=$zip"
          if ($code -ne 0) { throw "setup exited $code" }
          if (-not (Test-Path "$ReelixData\restore\pending.zip")) { throw 'the backup was not staged' }
          $rx = Start-Installed 7794
          $status = Invoke-RestMethod http://127.0.0.1:7794/api/v1/setup
          if ($status.needs_setup) { throw 'the restored database has no admin account' }
          Invoke-RestMethod -Method Post http://127.0.0.1:7794/api/v1/auth/login -ContentType 'application/json' `
            -Body (@{ username = 'restored-admin'; password = $Password } | ConvertTo-Json) | Out-Null
          if (Test-Path "$ReelixData\restore\pending.zip") { throw 'the staged restore was not applied' }
          Stop-Process -Id $rx.Id -Force; $rx.WaitForExit()
          Uninstall-Reelix
          Remove-Item $ReelixData, $src -Recurse -Force
      - name: smoke test (migration from another Reelix folder)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . scripts\windows-smoke.ps1
          $old = "$env:RUNNER_TEMP\old-reelix"
          Remove-Item $ReelixData -Recurse -Force -ErrorAction SilentlyContinue
          New-ReelixData "$old\data" 'old-admin' 7793
          # A location pinned to the old folder, which Setup has to point at the new one.
          $cfg = "$old\data\config.toml"
          (Get-Content $cfg -Raw).Replace('# log_dir = "<data_dir>/logs"', "log_dir = '$old\data\logs'") | Set-Content $cfg
          if (-not (Get-Content $cfg -Raw).Contains("log_dir = '")) { throw 'could not pin log_dir in the old config.toml' }
          $code = Install-Reelix 'migrate-folder' '/MODE=migrate', "/MIGRATEFROM=$old"
          if ($code -ne 0) { throw "setup exited $code" }
          foreach ($f in 'reelix.db', 'secret.key', 'config.toml') {
            if (-not (Test-Path "$ReelixData\$f")) { throw "$f was not copied to $ReelixData" }
          }
          if (-not (Test-Path "$old\data\reelix.db")) { throw 'the old folder was changed' }
          $toml = Get-Content "$ReelixData\config.toml" -Raw
          if ($toml.Contains('old-reelix')) { Write-Host $toml; throw 'config.toml still points at the old folder' }
          $rx = Start-Installed 7792
          Invoke-RestMethod -Method Post http://127.0.0.1:7792/api/v1/auth/login -ContentType 'application/json' `
            -Body (@{ username = 'old-admin'; password = $Password } | ConvertTo-Json) | Out-Null
          Stop-Process -Id $rx.Id -Force; $rx.WaitForExit()
          # A data folder that already has a database is never overwritten.
          Uninstall-Reelix
          $code = Install-Reelix 'migrate-folder-again' '/MODE=migrate', "/MIGRATEFROM=$old"
          if ($code -eq 0) { throw 'setup overwrote an existing database' }
          Remove-Item $ReelixData, $old -Recurse -Force
      - name: smoke test (migration from Radarr on this PC)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . scripts\windows-smoke.ps1
          Remove-Item $ReelixData -Recurse -Force -ErrorAction SilentlyContinue
          $arr = "$env:ProgramData\Radarr"
          $key = '0123456789abcdef0123456789abcdef'
          New-Item -ItemType Directory $arr -Force | Out-Null
          Set-Content "$arr\config.xml" "<Config><BindAddress>*</BindAddress><Port>7878</Port><SslPort>9898</SslPort><EnableSsl>False</EnableSsl><UrlBase></UrlBase><ApiKey>$key</ApiKey></Config>"
          $code = Install-Reelix 'migrate-arr' '/MODE=migrate', '/ARR=radarr'
          if ($code -ne 0) { throw "setup exited $code" }
          $rx = Start-Installed 7791
          # Setup from this PC needs no token; it signs the new admin in.
          Invoke-RestMethod -Method Post http://127.0.0.1:7791/api/v1/setup -ContentType 'application/json' -SessionVariable s `
            -Body (@{ username = 'admin'; password = $Password } | ConvertTo-Json) | Out-Null
          $pending = @(Invoke-RestMethod http://127.0.0.1:7791/api/v1/system/migrate/pending -WebSession $s)
          $pending | ConvertTo-Json | Write-Host
          if ($pending.Count -ne 1 -or $pending[0].source -ne 'radarr' -or $pending[0].url -ne 'http://localhost:7878' -or $pending[0].api_key -ne '********') {
            throw 'the Radarr found by Setup is not pending in Reelix'
          }
          Stop-Process -Id $rx.Id -Force; $rx.WaitForExit()
          if (Select-String -Path "$ReelixData\reelix.db*" -SimpleMatch $key -Quiet) { throw 'the API key is stored in plain text' }
          Uninstall-Reelix
          Remove-Item $ReelixData, $arr -Recurse -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: installer/*.exe
          if-no-files-found: error

  package:
    name: package
    needs: [prepare, archives, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Signed build provenance for the release assets (verify with `gh attestation verify`).
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dl8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: archives
          path: dist
      - name: retry download (archives)
        if: steps.dl8.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist
      - id: dl9
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: windows-installer
          path: dist
      - name: retry download (windows-installer)
        if: steps.dl9.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: dist
      - name: add Linux install script
        run: |
          install -m 755 packaging/linux/install.sh dist/install.sh
          ls -l dist
      # Syft reads the workspace Cargo.lock (copied alone so the fuzz crate's lockfile stays out).
      - name: prepare SBOM input
        run: mkdir sbom-src && cp Cargo.toml Cargo.lock sbom-src/
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sbom-src
          format: spdx-json
          output-file: dist/reelix-${{ env.VERSION }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: checksums
        working-directory: dist
        run: |
          for f in "reelix-$VERSION-sbom.spdx.json" "reelix-$VERSION-windows-x86_64-setup.exe" install.sh; do
            sha256sum "$f" > "$f.sha256"
          done
          cat *.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - name: attest build provenance
        if: needs.prepare.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/install.sh
            dist/*.spdx.json
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  linux-installer:
    name: linux installer
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - id: dl10
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: dist
          path: dist
      - name: retry download (dist)
        if: steps.dl10.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Runs the published install.sh against the built tarball under the runner's systemd.
      - name: smoke test install.sh
        run: |
          sudo sh dist/install.sh --archive-dir dist --version "$VERSION" --port 7798
          systemctl is-active reelix
          grep -qx '{"kind": "linux-systemd"}' /opt/reelix/install.json
          [ "$(stat -c %U /opt/reelix/reelix)" = reelix ]
          curl -fsS http://127.0.0.1:7798/api/v1/system/health
          curl -fsS http://127.0.0.1:7798/api/v1/setup
          # Re-running is an upgrade that keeps the port.
          sudo sh dist/install.sh --archive-dir dist --version "$VERSION"
          grep -q -- '--port 7798' /etc/systemd/system/reelix.service
          curl -fsS http://127.0.0.1:7798/api/v1/system/health
          sudo journalctl -u reelix --no-pager | tail -n 20
          sudo sh dist/install.sh --uninstall
          test ! -e /opt/reelix
          test ! -e /etc/systemd/system/reelix.service
          sudo test -d /var/lib/reelix
          sudo sh dist/install.sh --uninstall --purge
          sudo test ! -e /var/lib/reelix
          if id reelix; then echo "::error::reelix user still exists"; exit 1; fi

  docker:
    name: docker image
    needs: [prepare, web, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: dl3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: web
          path: artifacts/web
      - name: retry download (web)
        if: steps.dl3.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: artifacts/web
      - id: dl4
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: bin-linux-*
          path: artifacts
      - name: retry download (bin-linux-*)
        if: steps.dl4.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-linux-*
          path: artifacts
      - name: assemble build context
        run: |
          mkdir -p context/bin/amd64 context/bin/arm64 context/docker
          cp artifacts/bin-linux-amd64/reelix context/bin/amd64/
          cp artifacts/bin-linux-arm64/reelix context/bin/arm64/
          cp -R artifacts/web context/web
          cp docker/entrypoint.sh context/docker/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.VERSION }},enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
      - name: smoke test (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: docker/Dockerfile.release
          platforms: linux/amd64
          build-args: VERSION=${{ env.VERSION }}
          load: true
          tags: reelix:smoke
      - name: run smoke test
        run: |
          docker run -d --name reelix -p 7700:7700 reelix:smoke
          for i in $(seq 1 30); do
            docker exec reelix /app/reelix healthcheck && break
            sleep 2
          done
          docker exec reelix /app/reelix healthcheck
          curl -fsS http://127.0.0.1:7700/api/v1/setup
          docker logs reelix
          docker rm -f reelix
      - if: needs.prepare.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ env.VERSION }}
          push: ${{ needs.prepare.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

  publish:
    name: publish release
    needs: [prepare, package, docker, linux-installer]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - id: dl5
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: release-notes
          path: artifacts/release-notes
      - name: retry download (release-notes)
        if: steps.dl5.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: artifacts/release-notes
      - id: dl6
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: dist
          path: artifacts/dist
      - name: retry download (dist)
        if: steps.dl6.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: artifacts/dist
      - name: add Docker image to notes
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            cat artifacts/release-notes/release-notes.md
            echo
            echo "### Docker"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
          } > notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Reelix ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/dist/*.tar.gz
            artifacts/dist/*.zip
            artifacts/dist/*.exe
            artifacts/dist/install.sh
            artifacts/dist/*.spdx.json
            artifacts/dist/*.sha256
            artifacts/dist/SHA256SUMS
